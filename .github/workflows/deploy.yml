# النشر إلى Cloudflare Workers عند كل دفعة إلى main (أو يدويًّا من صفحة Actions).
#
# يحتاج سرًّا واحدًا في المستودع: Settings ← Secrets and variables ← Actions
#   CLOUDFLARE_API_TOKEN      رمز API من قالب «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID     اختياري — يلزم فقط إن كان الرمز يطال أكثر من حساب
#
# ولا ترحيل يدوي للقاعدة: المنصة تُنشئ ما نقص من جداول ذاتيًّا عند أول طلب بعد النشر.
name: النشر إلى Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# نشرتان متزامنتان على العامل نفسه تتسابقان، فنُبقي الأحدث وحدها
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: بناء ونشر
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      # فحص الأنواع قبل النشر: خطأ نوعي يُوقف النشر بدل أن يصل إلى المستخدمين
      - name: فحص الأنواع
        run: npx tsc --noEmit

      - name: التحقّق من وجود رمز Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::لم يُضبط السرّ CLOUDFLARE_API_TOKEN في المستودع — أضفه من Settings ← Secrets and variables ← Actions، ثم أعد تشغيل هذا الخط."
            exit 1
          fi

      # نستعمل wrangler المثبَّت في المشروع نفسه لا إصدارًا خارجيًّا،
      # فما يُنشر هنا هو ما يعمل محليًّا حرفًا بحرف.
      - name: النشر
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
