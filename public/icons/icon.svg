<!-- أصل أيقونة المنصة: ورقة محضر بزاوية مطويّة وعلامة اعتماد، على أخضر الهوية.
     منها تُولَّد أيقونات التطبيق (512 · 192 · 180) وشاشات الإقلاع التسع — كلها
     ملء المربّع بلا شفافية (فالنظام يقصّ الزوايا بنفسه)، والرسم داخل ٨٠٪ الوسط
     ليبقى سالمًا تحت قناع أندرويد. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#1f6f54"/>
  <!-- ورقة المحضر بزاوية مطويّة -->
  <path d="M150 110 H311 L382 180 V382 A20 20 0 0 1 362 402 H150 A20 20 0 0 1 130 382 V130 A20 20 0 0 1 150 110 Z" fill="#ffffff"/>
  <path d="M311 110 L382 180 H311 Z" fill="#b9d6ca"/>
  <!-- سطر العنوان -->
  <path d="M173 193 H301" stroke="#1f6f54" stroke-width="23" stroke-linecap="round"/>
  <!-- علامة الاعتماد -->
  <path d="M175 311 L233 369 L339 251" fill="none" stroke="#1f6f54" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
