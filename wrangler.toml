name = "tarbawi-council-platform"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# الواجهة الأمامية (SPA) تُقدَّم كأصول ثابتة عبر الـ Worker
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# قاعدة البيانات D1 — لكل البيانات المهيكلة
# أنشئ القاعدة عبر: wrangler d1 create tarbawi-db  ثم ضع المعرّف هنا
[[d1_databases]]
binding = "DB"
database_name = "tarbawi-db"
database_id = "190aa70c-f20f-44c3-8a5d-794abff77dc7"
migrations_dir = "migrations"

# تخزين الملفات R2 — المرفقات، صور التواقيع، الشعار، الملفات المصدَّرة، النسخ الاحتياطية
# أنشئ الحاوية عبر: wrangler r2 bucket create tarbawi-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "tarbawi-files"

# الذكاء الاصطناعي (Workers AI) — صياغة المحاضر، استخراج القرارات، التفريغ الصوتي، التلخيص
[ai]
binding = "AI"

# المهام المجدولة — التذكيرات اليومية (تُفعَّل في مرحلة الإشعارات)
[triggers]
crons = ["0 5 * * *"]

[vars]
APP_NAME = "منصة المجلس التربوي"
# متغيرات البريد تُضاف كأسرار: wrangler secret put RESEND_API_KEY
#
# إشعارات الدفع (Web Push) تعمل تلقائيًا: يُولَّد زوج مفاتيح VAPID عند أول طلب ويُحفظ
# في جدول الإعدادات. ولتثبيت المفاتيح خارج القاعدة (مستحسن للإنتاج) اضبطها كأسرار:
#   wrangler secret put VAPID_PUBLIC_KEY     # النقطة العامة بترميز base64url
#   wrangler secret put VAPID_PRIVATE_KEY    # المُركّبة d من JWK
#   wrangler secret put VAPID_SUBJECT        # mailto:admin@example.com
# تغيير المفاتيح يُبطل اشتراكات الأجهزة القائمة (تُسجَّل من جديد عند فتح التطبيق).
